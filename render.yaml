services:
  - type: web
    name: find-the-rest-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false
      - key: FIND_THE_REST_API_KEY
        generateValue: true
      - key: ENABLE_LOCAL_TRANSCRIPTION
        value: "0"

